train:
  phase1:
    name: phase1_arcface_supcon

    max_epochs: 1
    patience: 5

    learning_rate: 1e-3
    weight_decay: 1e-4

    warmup_epochs: 2
    warmup_lr: 1e-5

    scheduler: cosine
    optimizer: adamw

    gradient_accumulation_steps: 1

    loss:
      name: arcface_supcon
      arcface_weight: 1.0
      supcon_weight: 0.5